# Seguridad continua, aparte de las pruebas: análisis estático (CodeQL), secretos
# filtrados (gitleaks), dependencias nuevas con vulnerabilidades (dependency
# review) y auditoría semanal. Ninguno necesita secretos del repositorio.
name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    # Lunes 14:00 UTC: un CVE nuevo puede aparecer sin que cambie el código.
    - cron: "0 14 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisión de dependencias nuevas
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  audit:
    name: Auditoría semanal de dependencias
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (producción)
        run: pnpm audit --prod --audit-level high
