# Pipeline de main: Pull Requests hacia `main` (puerta de la release) y, ya
# mergeado, el deploy. Mismos pasos que dev más Playwright.
name: CI main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      run-e2e: true

